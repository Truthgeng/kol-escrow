name: agent
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print actions without sending transactions"
        type: boolean
        default: false
      post_url:
        description: "Only check this X post link with the free embed lookup, then stop"
        type: string
        default: ""
concurrency: agent
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check one post
        if: inputs.post_url != ''
        env:
          POST_URL: ${{ inputs.post_url }}
        run: node scripts/check-post.js
      - name: Run one pass
        if: inputs.post_url == ''
        env:
          KEY_SEED: ${{ secrets.KEY_SEED }}
          NEAR_NETWORK: ${{ vars.NEAR_NETWORK }}
          ESCROW_CONTRACT: ${{ vars.ESCROW_CONTRACT }}
          AGENT_ACCOUNT: ${{ vars.AGENT_ACCOUNT }}
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          X_MODE: ${{ vars.X_MODE }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}
          NEARAI_MODEL: ${{ vars.NEARAI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          if [ -z "$ESCROW_CONTRACT$KEY_SEED" ]; then echo "Not deployed yet, skipping"; exit 0; fi
          node src/run.js
