name: record
# Records the live site for the demo video. shots: lines of "<name> <path> [actions]"
on:
  workflow_dispatch:
    inputs:
      shots:
        description: "One or more shots separated by ;  e.g. submitted #/c/2 wait:3000,scroll:400"
        type: string
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Record
        env:
          SHOTS: ${{ inputs.shots }}
        run: |
          IFS=';' read -ra list <<< "$SHOTS"
          for s in "${list[@]}"; do node demo/record.mjs $s; done
      - name: Save to the demo-footage branch
        run: |
          mkdir -p /tmp/f && cp demo/out/*.webm demo/out/*.png /tmp/f/
          git config user.name "kol-escrow-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin demo-footage 2>/dev/null && git checkout demo-footage || git checkout --orphan demo-footage
          git rm -rfq --cached . 2>/dev/null || true
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +
          cp /tmp/f/* .
          git add *.webm *.png
          git commit -qm "Footage: $(ls /tmp/f | tr '\n' ' ')" && git push -q origin demo-footage
