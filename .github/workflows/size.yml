name: wasm-size
on:
  workflow_dispatch:
jobs:
  size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-near and binaryen
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          sudo apt-get update -qq && sudo apt-get install -y -qq binaryen
          cargo near build --help | grep -iE "abi|opt" || true
          cargo near build non-reproducible-wasm --help | grep -iE "abi|opt" || true
      - name: Sizes
        run: |
          cargo near build non-reproducible-wasm --no-abi && cp target/near/kol_escrow.wasm /tmp/opt-z.wasm
          sed -i 's/^opt-level = "z"/opt-level = "s"/' Cargo.toml
          cargo near build non-reproducible-wasm --no-abi && cp target/near/kol_escrow.wasm /tmp/opt-s.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-sign-ext --enable-nontrapping-float-to-int --strip-debug --strip-producers -o /tmp/opt-z-oz.wasm /tmp/opt-z.wasm
          ls -l /tmp/*.wasm | tee -a "$GITHUB_STEP_SUMMARY"
      - name: What takes the space
        run: |
          sed -i 's/^opt-level = "s"/opt-level = "z"/; s/^strip = true/strip = false/' Cargo.toml
          cargo build --target wasm32-unknown-unknown --release 2>/dev/null
          cargo install twiggy --locked -q
          twiggy top -n 40 target/wasm32-unknown-unknown/release/kol_escrow.wasm | sed 's/^/TW /'
          twiggy garbage -n 5 target/wasm32-unknown-unknown/release/kol_escrow.wasm | sed 's/^/TW /'
