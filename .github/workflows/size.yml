name: wasm-size
on:
  workflow_dispatch:
jobs:
  size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-near and binaryen
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          sudo apt-get update -qq && sudo apt-get install -y -qq binaryen
          cargo near build --help | grep -iE "abi|opt" || true
          cargo near build non-reproducible-wasm --help | grep -iE "abi|opt" || true
      - name: Sizes
        run: |
          cargo near build non-reproducible-wasm && cp target/near/kol_escrow.wasm /tmp/default.wasm
          cargo near build non-reproducible-wasm --no-abi && cp target/near/kol_escrow.wasm /tmp/noabi.wasm || echo "no --no-abi flag"
          wasm-opt -Oz --enable-bulk-memory --enable-sign-ext --strip-debug --strip-producers -o /tmp/noabi-oz.wasm /tmp/noabi.wasm || wasm-opt -Oz --strip-debug -o /tmp/noabi-oz.wasm /tmp/default.wasm
          ls -l /tmp/*.wasm | tee -a "$GITHUB_STEP_SUMMARY"
