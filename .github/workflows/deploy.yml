name: deploy-testnet
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the live end-to-end test after deploying"
        type: boolean
        default: true
concurrency: agent
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the KEY_SEED secret
        env:
          KEY_SEED: ${{ secrets.KEY_SEED }}
        run: |
          if [ ${#KEY_SEED} -lt 24 ]; then
            echo "::error::Add a repository secret named KEY_SEED (any random text, 24+ characters) under Settings > Secrets and variables > Actions"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build contracts
        run: |
          (cd contract && cargo near build non-reproducible-wasm)
          (cd test-token && cargo near build non-reproducible-wasm)
          ls -l contract/target/near test-token/target/near
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: agent
      - name: Deploy to testnet
        working-directory: agent
        env:
          KEY_SEED: ${{ secrets.KEY_SEED }}
          ESCROW_WASM: ../contract/target/near/kol_escrow.wasm
          TOKEN_WASM: ../test-token/target/near/test_token.wasm
        run: node scripts/deploy.js
      - name: End-to-end test on testnet
        if: inputs.run_e2e
        working-directory: agent
        env:
          KEY_SEED: ${{ secrets.KEY_SEED }}
        run: node scripts/e2e.js | tee e2e.log
      - name: Summary
        if: always()
        working-directory: agent
        run: |
          { echo '### Deployment'; echo '```json'; cat deployment.json 2>/dev/null; echo '```';
            echo '### End-to-end test'; echo '```'; cat e2e.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment
          path: |
            agent/deployment.json
            agent/e2e.log
