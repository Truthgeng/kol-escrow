name: agent-loop
# Backup for the 15-minute schedule, which GitHub can be slow to start on new repos.
# One job runs a pass every 15 minutes for about 5.5 hours, then starts a fresh copy of itself.
# (A workflow_dispatch made with GITHUB_TOKEN is allowed to start a new run.)
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"
concurrency:
  group: agent-loop
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Passes every 15 minutes
        env:
          KEY_SEED: ${{ secrets.KEY_SEED }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}
          NEARAI_MODEL: ${{ vars.NEARAI_MODEL }}
        run: |
          if [ -z "$KEY_SEED" ]; then echo "KEY_SEED not set, nothing to watch"; exit 0; fi
          for i in $(seq 1 21); do
            echo "::group::pass $i at $(date -u +%H:%M)"
            node src/run.js || echo "pass $i had errors, trying again next pass"
            echo "::endgroup::"
            [ "$i" -lt 21 ] && sleep 900
          done
      - name: Start the next loop
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent-loop.yml --ref main -R "$GITHUB_REPOSITORY"
